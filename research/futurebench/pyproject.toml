[project]
name = "futurebench"
version = "0.1.0"
description = "FutureClick benchmark evaluation dataset and harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# FC-008 Sprint 3 reference training. NumPy and scikit-learn only; SciPy, joblib, and
# threadpoolctl arrive as scikit-learn's own requirements rather than as choices made
# here. Deliberately absent: PyTorch, TensorFlow, JAX, ONNX Runtime, and every hosted
# inference SDK. A 429-row corpus with 370 features needs none of them, and any remote
# SDK would give offline research code a network capability it must not have.
dependencies = [
    "numpy>=2.1,<3",
    "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/futurebench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
